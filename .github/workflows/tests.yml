name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install numpy
        run: python -m pip install --upgrade pip numpy matplotlib

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Run the zero-dependency demo
        run: python examples/demo.py

      - name: Run the stacking-geometry demo
        run: python examples/demo_stacking.py

      - name: Check every tool answers --help
        run: |
          for f in scripts/*.py; do
            [ "$f" = "scripts/namdlib.py" ] && continue
            python "$f" --help > /dev/null || exit 1
          done